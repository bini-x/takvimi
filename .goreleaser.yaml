version: 2

builds:
  - id: takvimi
    main: .
    binary: takvimi
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: archives
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: binaries
    formats:
      - binary

checksum:
  name_template: "checksums.txt"
